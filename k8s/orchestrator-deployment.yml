apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopselfcheckout-orchestrator
  labels:
    app: shopselfcheckout-orchestrator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopselfcheckout-orchestrator
  template:
    metadata:
      labels:
        app: shopselfcheckout-orchestrator
    spec:
      containers:
      - name: shopselfcheckout-orchestrator
        image: shopselfcheckout-orchestrator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: KAFKA_BROKERS
          value: "kafka-service:9092"
        - name: POSTGRES_URL
          value: "postgresql://shopselfcheckout:shopselfcheckout2026@postgres-service:5432/shopselfcheckout_main"
        - name: MONGODB_URL
          value: "mongodb://mongodb-service:27017/shopselfcheckout_events"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: shopselfcheckout-orchestrator-service
spec:
  selector:
    app: shopselfcheckout-orchestrator
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: LoadBalancer
